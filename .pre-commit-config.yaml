# SPDX-License-Identifier: Apache-2.0
repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        # install everything ESLint needs to parse React+TypeScript
        additional_dependencies:
          - eslint@8.56.0
          - eslint-plugin-react
          - "@typescript-eslint/parser"
          - "@typescript-eslint/eslint-plugin"
        # only lint TS files under frontend/src
        files: ^frontend/src/.*\.(ts|tsx)$
        # tell ESLint which extensions to look for, and auto-fix
        args:
          - --ext
          - .ts,.tsx
          - --fix
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: "^frontend/src"
